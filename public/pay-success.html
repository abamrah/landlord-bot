<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful — NestMind</title>
    <link rel="icon" href="/nestmind-favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0fdf4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 48px 40px;
            max-width: 480px;
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon svg {
            width: 40px;
            height: 40px;
            fill: #fff;
        }

        h1 {
            font-size: 24px;
            color: #15803d;
            margin-bottom: 12px;
        }

        p {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .small {
            font-size: 13px;
            color: #9ca3af;
        }

        .receipt-note {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            font-size: 14px;
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" />
            </svg>
        </div>
        <h1>Payment Successful!</h1>
        <p>Your rent payment has been processed successfully. A receipt has been sent to your email.</p>
        <div class="receipt-note">
            <strong>Receipt:</strong> A payment receipt will be emailed to you by Stripe. You can also request a receipt
            from your landlord at any time (Ontario RTA s.109).
        </div>
        <p class="small">You can safely close this page.</p>
    </div>
</body>

</html>
